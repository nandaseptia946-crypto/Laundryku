<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundryku - Manajemen Laundry</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #007bff;
            margin-bottom: 5px;
        }

        .form-section, .data-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .btn-hapus {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-hapus:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧺 Aplikasi Laundryku</h1>
            <p>Kelola pesanan laundry dengan cepat dan mudah.</p>
        </header>

        <section class="form-section">
            <h2>Tambah Pesanan Baru</h2>
            <form id="laundryForm">
                <div class="input-group">
                    <label for="namaPelanggan">Nama Pelanggan:</label>
                    <input type="text" id="namaPelanggan" required placeholder="Contoh: Budi Santoso">
                </div>
                <div class="input-group">
                    <label for="jenisLayanan">Jenis Layanan:</label>
                    <select id="jenisLayanan">
                        <option value="Cuci Kering (Rp 5.000/kg)">Cuci Kering (Rp 5.000/kg)</option>
                        <option value="Cuci Setrika (Rp 7.000/kg)">Cuci Setrika (Rp 7.000/kg)</option>
                        <option value="Setrika Saja (Rp 4.000/kg)">Setrika Saja (Rp 4.000/kg)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="berat">Berat (Kg):</label>
                    <input type="number" id="berat" min="1" required placeholder="Jumlah berat pakaian">
                </div>
                <button type="submit" class="btn-submit">Simpan Pesanan</button>
            </form>
        </section>

        <section class="data-section">
            <h2>Daftar Pesanan Laundry</h2>
            <table id="laundryTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Layanan</th>
                        <th>Berat (Kg)</th>
                        <th>Total Harga</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    <!-- Data pesanan akan masuk di sini secara otomatis -->
                </tbody>
            </table>
        </section>
    </div>

    <script>
        document.getElementById('laundryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('namaPelanggan').value;
            const layananText = document.getElementById('jenisLayanan').value;
            const berat = parseFloat(document.getElementById('berat').value);

            // Hitung harga otomatis berdasarkan layanan
            let hargaPerKg = 5000;
            if (layananText.includes('Cuci Setrika')) {
                hargaPerKg = 7000;
            } else if (layananText.includes('Setrika Saja')) {
                hargaPerKg = 4000;
            }

            const totalHarga = berat * hargaPerKg;

            // Format ke Rupiah
            const formatRupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(totalHarga);

            const tabelBody = document.getElementById('tabelBody');
            const rowCount = tabelBody.rows.length + 1;

            const newRow = tabelBody.insertRow();
            newRow.innerHTML = `
                <td>${rowCount}</td>
                <td>${nama}</td>
                <td>${layananText}</td>
                <td>${berat} Kg</td>
                <td>${formatRupiah}</td>
                <td><span style="color: orange; font-weight: bold;">Proses</span></td>
                <td><button class="btn-hapus" onclick="hapusBaris(this)">Hapus</button></td>
            `;

            // Reset Form
            document.getElementById('laundryForm').reset();
        });

        function hapusBaris(button) {
            const row = button.parentElement.parentElement;
            row.remove();
        }
    </script>
</body>
</html>
